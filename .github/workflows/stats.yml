name: Update Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, html, urllib.request
          from collections import Counter

          USER = os.environ["GH_USER"]
          TOKEN = os.environ.get("GH_TOKEN", "")

          QUERY = """query($login:String!){user(login:$login){
          followers{totalCount}
          repositories(ownerAffiliations:OWNER,isFork:false,first:100,orderBy:{field:PUSHED_AT,direction:DESC}){
          totalCount nodes{stargazerCount primaryLanguage{name color}}}
          contributionsCollection{totalCommitContributions totalPullRequestContributions totalIssueContributions
          contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}"""

          def fetch():
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": QUERY, "variables": {"login": USER}}).encode(),
                  headers={"Authorization": "bearer " + TOKEN, "User-Agent": "profile-cards",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)["data"]["user"]

          def streaks(days):
              counts = [d["contributionCount"] for d in days]
              longest = cur = 0
              for c in counts:
                  cur = cur + 1 if c > 0 else 0
                  longest = max(longest, cur)
              i = len(counts) - 1
              if i >= 0 and counts[i] == 0:
                  i -= 1
              current = 0
              while i >= 0 and counts[i] > 0:
                  current += 1
                  i -= 1
              return current, longest

          def render(u):
              cc = u["contributionsCollection"]
              cal = cc["contributionCalendar"]
              weeks = cal["weeks"]
              days = [d for w in weeks for d in w["contributionDays"]]
              cur, longest = streaks(days)
              repos = u["repositories"]["nodes"]
              stars = sum(r["stargazerCount"] for r in repos)
              langs = Counter()
              colors = {}
              for r in repos:
                  pl = r["primaryLanguage"]
                  if pl:
                      langs[pl["name"]] += 1
                      colors[pl["name"]] = pl["color"] or "#8b5cf6"
              top = langs.most_common(5)
              stats = [
                  ("CONTRIBUTIONS (1Y)", cal["totalContributions"]),
                  ("COMMITS", cc["totalCommitContributions"]),
                  ("PULL REQUESTS", cc["totalPullRequestContributions"]),
                  ("PUBLIC REPOS", u["repositories"]["totalCount"]),
                  ("STARS EARNED", stars),
                  ("FOLLOWERS", u["followers"]["totalCount"]),
                  ("CURRENT STREAK", f"{cur}d"),
                  ("LONGEST STREAK", f"{longest}d"),
              ]
              W, H = 780, 330
              s = []
              s.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">')
              s.append("""<style>
          .t{font:700 15px 'Courier New',monospace;fill:#e2e8f0;letter-spacing:2px}
          .l{font:11px 'Courier New',monospace;fill:#94a3b8;letter-spacing:1px}
          .v{font:700 16px 'Courier New',monospace;fill:#c4b5fd}
          .n{font:12px 'Courier New',monospace;fill:#e2e8f0}
          .c{opacity:0;animation:pop .5s ease-out forwards}
          @keyframes pop{from{opacity:0}to{opacity:1}}
          .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s ease-out both}
          @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
          .glowb{animation:gb 4s ease-in-out infinite alternate}
          @keyframes gb{from{opacity:.35}to{opacity:.95}}
          </style>
          <defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>""")
              s.append(f'<rect x="3" y="3" width="{W-6}" height="{H-6}" rx="16" fill="#0b1026"/>')
              s.append(f'<text class="t" x="28" y="36">{html.escape(USER.upper())} // GITHUB STATS</text>')
              # stats grid (2 cols x 4 rows)
              for i, (label, val) in enumerate(stats):
                  col, row = i // 4, i % 4
                  x = 28 + col * 190
                  y = 66 + row * 30
                  s.append(f'<text class="l" x="{x}" y="{y}">{label}</text>')
                  s.append(f'<text class="v" x="{x}" y="{y+16}">{val}</text>')
              # languages
              s.append('<text class="l" x="430" y="66">TOP LANGUAGES (BY REPOS)</text>')
              total = sum(c for _, c in top) or 1
              for i, (name, c) in enumerate(top):
                  y = 80 + i * 22
                  w = max(6, 200 * c / total)
                  col = colors.get(name, "#8b5cf6")
                  s.append(f'<text class="n" x="430" y="{y+11}">{html.escape(name)}</text>')
                  s.append(f'<rect x="530" y="{y}" width="200" height="12" rx="3" fill="#1e293b"/>')
                  s.append(f'<rect class="bar" style="animation-delay:{i*0.15:.2f}s" x="530" y="{y}" width="{w:.0f}" height="12" rx="3" fill="{html.escape(col)}"/>')
              if not top:
                  s.append('<text class="n" x="430" y="96">no public repos yet</text>')
              # heatmap
              m = max([d["contributionCount"] for d in days] + [1])
              pal = ["#1e293b", "#4c1d95", "#6d28d9", "#8b5cf6", "#c4b5fd"]
              s.append('<text class="l" x="28" y="196">CONTRIBUTIONS, LAST YEAR</text>')
              for wi, w in enumerate(weeks):
                  for di, d in enumerate(w["contributionDays"]):
                      c = d["contributionCount"]
                      lvl = 0 if c == 0 else 1 + min(3, int((c - 1) * 4 / m))
                      x = 28 + wi * 14
                      y = 206 + di * 14
                      s.append(f'<rect class="c" style="animation-delay:{wi*0.03:.2f}s" x="{x}" y="{y}" width="11" height="11" rx="2" fill="{pal[lvl]}"/>')
              s.append(f'<rect class="glowb" x="2" y="2" width="{W-4}" height="{H-4}" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>')
              s.append("</svg>")
              return "\n".join(s)

          if __name__ == "__main__":
              os.makedirs("assets", exist_ok=True)
              open("assets/stats.svg", "w").write(render(fetch()))
              print("stats.svg written")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || git commit -m "update stats card"
          git pull --rebase
          git push
